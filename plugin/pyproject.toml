[project]
name = "Bambuddy"
version = "0.1.0"
description = "Import Bambuddy printers into OrcaSlicer and send prints through the Bambuddy queue."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bambuddy"]
artifacts = ["src/bambuddy/web/index.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
