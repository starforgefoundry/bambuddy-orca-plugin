[tools]
node = "lts"
pnpm = "latest"
python = "3.12"
uv = "latest"

[tasks."ui:build"]
dir = "ui"
run = ["pnpm install --frozen-lockfile", "pnpm build"]

[tasks."ui:test"]
dir = "ui"
run = ["pnpm check", "pnpm test"]

[tasks."plugin:test"]
dir = "plugin"
run = "uv run --group dev pytest"

[tasks.test]
depends = ["ui:test", "plugin:test"]

[tasks.build]
description = "Build the installable plugin wheel into dist/"
depends = ["ui:build"]
run = [
  "cp ui/dist/index.html plugin/src/bambuddy/web/index.html",
  "uv build --wheel --project plugin --out-dir dist",
]
